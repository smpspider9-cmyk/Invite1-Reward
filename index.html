<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account verification - MCTiers</title>
<style>
  :root{
    --background:#0a0a0a;
    --card:#111111;
    --border:#262626;
    --foreground:#e2e8f0;
    --muted:#a1a1aa;
    --tier-1:#f2b53c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--background);color:var(--foreground);
    font-family:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    min-height:100vh;display:grid;place-items:center;padding:16px;
    background:var(--background);
  }
  .card{
    position:relative;overflow:hidden;width:100%;max-width:576px;
    background:var(--card);border:2px solid var(--border);border-radius:12px;padding:40px;
    animation:in .45s cubic-bezier(.16,1,.3,1);
  }
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  @media (max-width:640px){.card{padding:24px}}

  .glow{position:absolute;inset:0;pointer-events:none}
  .glow .a{
    position:absolute;top:-224px;left:-160px;width:576px;height:576px;border-radius:50%;
    background:color-mix(in srgb, var(--tier-1) 10%, transparent);filter:blur(120px);
  }
  .glow .b{
    position:absolute;bottom:-256px;right:-96px;width:544px;height:544px;border-radius:50%;
    background:rgba(59,130,246,.10);filter:blur(120px);
  }
  .inner{position:relative}

  .logo{display:block;height:32px;width:auto;margin:0 auto 28px;object-fit:contain}
  .logoFallback{
    height:32px;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;gap:8px;
    font-weight:800;font-size:20px;letter-spacing:-.04em;
  }
  .logoFallback .cube{
    width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:14px;
    background:linear-gradient(150deg,#f7c453,#c07f18);color:#1a1206;
  }
  .logoFallback b{
    background:linear-gradient(92deg,#ffd479,#f2b53c 55%,#c9d3e0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  .head{text-align:center;margin-bottom:20px}
  h1{font-size:24px;font-weight:700;color:#e2e8f0;letter-spacing:-.02em;margin-bottom:4px}
  .head p{font-size:14px;color:var(--muted)}

  form{display:grid;gap:12px}
  input{
    height:44px;width:100%;border-radius:8px;background:rgba(0,0,0,.25);
    border:2px solid var(--border);padding:0 16px;color:#e2e8f0;font-size:14px;
    text-align:center;outline:none;transition:border-color .1s;font-family:inherit;
  }
  input::placeholder{color:var(--muted)}
  input:focus{border-color:color-mix(in srgb, var(--tier-1) 60%, transparent)}
  input.bad{border-color:#dc2626}

  button{
    height:44px;width:100%;border:0;border-radius:6px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-size:14px;font-weight:700;font-family:inherit;
    background:#1d4ed8;color:#fff;transition:background .15s,transform .08s,opacity .15s;
  }
  button:hover:not(:disabled){background:#2563eb}
  button:active:not(:disabled){transform:scale(.95)}
  button:disabled{opacity:.5;cursor:default;pointer-events:none}
  button svg{width:14px;height:14px;flex:none}

  .spinner{
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .done{display:none;text-align:center}
  .done.on{display:block;animation:in .4s ease}
  .badge{
    width:48px;height:48px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
    background:color-mix(in srgb, var(--tier-1) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--tier-1) 45%, transparent);
    color:var(--tier-1);font-size:22px;
  }
  .done h2{font-size:18px;font-weight:700;margin-bottom:6px}
  .done p{font-size:13px;color:var(--muted);line-height:1.6}
  .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:700;
    letter-spacing:.16em;color:var(--tier-1);margin:14px 0 4px;
  }
  .who{font-size:13px;color:#e2e8f0;font-weight:600}
  .kbd{
    display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;
    background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:4px;padding:2px 6px;
    color:var(--tier-1);
  }
  .again{
    margin-top:16px;background:transparent;border:1px solid var(--border);color:var(--muted);
    height:38px;font-size:13px;font-weight:600;
  }
  .again:hover:not(:disabled){background:#1a1a1a;color:#e2e8f0}

  .toasts{position:fixed;bottom:16px;right:16px;display:grid;gap:8px;z-index:9999;width:330px;max-width:calc(100vw - 32px)}
  .toast{
    background:#000;border:1px solid #333;border-radius:8px;padding:13px 14px;
    font-size:13px;color:#e8e8e8;box-shadow:0 4px 12px rgba(0,0,0,.4);
    display:flex;gap:8px;align-items:flex-start;animation:tin .3s ease;
  }
  .toast .ic{flex:none;margin-top:1px}
  .toast.err{border-color:#5b1a1a;color:#ffb3b3}
  .toast.err .ic{color:#ff6b6b}
  .toast.ok{border-color:#14402a;color:#a7f3c9}
  .toast.ok .ic{color:#4ade80}
  .toast.out{animation:tout .25s ease forwards}
  @keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div class="screen">
  <main class="card">
    <div class="glow" aria-hidden="true"><div class="a"></div><div class="b"></div></div>

    <div class="inner">
      <img class="logo" src="https://mctiers.link/icons/nav_skip.png" alt="MCTiers"
           onerror="this.outerHTML='&lt;div class=&quot;logoFallback&quot;&gt;&lt;span class=&quot;cube&quot;&gt;◈&lt;/span&gt;&lt;b&gt;MCTIERS&lt;/b&gt;&lt;/div&gt;'">

      <div id="stage">
        <div class="head">
          <h1>MCTiers Verification</h1>
          <p>Enter your Minecraft username to get started.</p>
        </div>

        <form id="f" novalidate>
          <input id="username" placeholder="Username" autocomplete="off" spellcheck="false"
                 maxlength="16" autofocus>
          <button type="submit" id="go" disabled>
            <span id="goText">Continue</span>
            <svg viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
              <path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/>
            </svg>
          </button>
        </form>
      </div>

      <div class="done" id="done">
        <div class="badge">✓</div>
        <h2>Account linked</h2>
        <div class="who" id="doneName"></div>
        <div class="code" id="doneCode"></div>
        <p>Run <span class="kbd">/verify</span> in-game within 10 minutes to confirm ownership.</p>
        <button class="again" id="again">Link another account</button>
      </div>
    </div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<script>
(() => {
  const ARROW = '<svg viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></svg>';

  const input = document.getElementById('username');
  const go = document.getElementById('go');
  const goText = document.getElementById('goText');
  const form = document.getElementById('f');
  const stage = document.getElementById('stage');
  const done = document.getElementById('done');

  const toast = (msg, type = 'err') => {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = '<span class="ic">' + (type === 'ok' ? '✓' : '!') + '</span><span>' + msg + '</span>';
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 3600);
  };

  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^A-Za-z0-9_]/g, '').slice(0, 16);
    go.disabled = input.value.length === 0;
    input.classList.remove('bad');
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = input.value.trim();

    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) {
      input.classList.add('bad');
      toast('Usernames are 3–16 characters: letters, numbers and underscores only.');
      input.focus();
      return;
    }

    go.disabled = true;
    goText.textContent = 'Checking';
    go.querySelector('svg').outerHTML = '<span class="spinner"></span>';

    setTimeout(() => {
      const code = 'MCT-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('doneName').textContent = name;
      document.getElementById('doneCode').textContent = code;
      stage.style.display = 'none';
      done.classList.add('on');
      toast('Username verified. Finish linking in-game.', 'ok');
    }, 1200);
  });

  document.getElementById('again').addEventListener('click', () => {
    done.classList.remove('on');
    stage.style.display = 'block';
    input.value = '';
    input.classList.remove('bad');
    goText.textContent = 'Continue';
    go.innerHTML = '<span id="goText">Continue</span>' + ARROW;
    go.disabled = true;
    input.focus();
  });
})();
</script>
</body>
</html>
